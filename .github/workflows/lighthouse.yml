# ============================================================
# Lighthouse CI — accessibility + performance + SEO gates
# ============================================================
# Runs on every push to non-main branches + every PR. Builds
# the site (next build) and serves it with `next start` (see
# lighthouserc.json startServerCommand), runs Lighthouse
# against six URLs (home, shop, a product page, the bag, the
# journal index and one post), and asserts category scores
# against the floors in lighthouserc.json.
#
# What BLOCKS: accessibility and SEO, at 0.95. Both are DOM
# audits, so they score the same on every run and on every
# machine — that is what makes them safe to gate on. /cart is
# held to accessibility but not to SEO: the bag is deliberately
# noindex, and that one audit is 4 of the 10 SEO points.
#
# What only WARNS: performance and best-practices. Performance
# is genuinely poor on the product page and is real work, not a
# threshold; best-practices is capped around 0.75 by the ad
# tags' third-party cookies, which is a business decision. The
# reasoning for each is written out in lighthouserc.json.
#
# The Lighthouse report URL gets posted as a PR comment so
# reviewers can click through to the full audit.
# ============================================================

name: Lighthouse

on:
  push:
    branches-ignore: [ "main" ]
  pull_request:

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run next:build

      - name: Run Lighthouse CI
        run: npx lhci autorun
        env:
          # Lighthouse posts results to its public-storage server
          # under this token; the PR comment links back here.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
